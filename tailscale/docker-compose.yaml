services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    hostname: sol
    # Linux host (sol): share the host's network namespace so the PC ITSELF is
    # the tailnet node. Every port bound on sol (ssh, samba, dockge, game
    # servers, ...) is reachable at sol:<port> with no per-port forwarders.
    # The macOS setup needed serve.json forwarders only because Docker
    # Desktop's VM sat between the container and the Mac -- not the case here.
    network_mode: host
    volumes:
      - ./config:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # No `sysctls:` -- they are rejected with network_mode: host. Forwarding
    # is a HOST setting: ipv4 is already 1 (docker enables it); ipv6 needs
    # /etc/sysctl.d/99-tailscale.conf, see README.md.
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      # Kernel mode (tailscale0 on the host). The image defaults to userspace.
      - TS_USERSPACE=false
      # Must match the host's firewall backend. Debian 13's docker uses
      # iptables-nft with FORWARD policy DROP; the image autodetects legacy
      # iptables, so its ts-forward ACCEPTs land in the legacy table and
      # docker's nft DROP still eats every subnet-routed packet (symptom:
      # tailnet clients time out on 192.168.1.60, "policy DROP" counter rises).
      - TS_DEBUG_FIREWALL_MODE=nftables
      - TS_HOSTNAME=sol
      # No TS_ROUTES / exit node: the UniFi gateway (ucg-fiber, private
      # unifi-gateway repo) is the subnet router for the NAS and the exit node,
      # so remote access doesn't depend on sol being up. sol is a plain node.
      # --accept-dns=false so the container doesn't fight the host resolver.
      - TS_EXTRA_ARGS=--accept-dns=false
